plugins {
    id 'com.android.application'
}

android {
    namespace 'iq.haji.alhjexx'
    compileSdk 35

    defaultConfig {
        applicationId 'iq.haji.alhjexx'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '2048m'
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// التطبيق لا يستخدم أي مكتبة خارجية: واجهات Android الأساسية وSQLite فقط.
// الاعتمادات أدناه للاختبارات فقط ولا تدخل في ملف APK.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
